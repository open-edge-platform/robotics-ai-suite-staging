<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 260" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="900" height="260" fill="#ffffff"/>
  <text x="450" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#0f172a">ACT — Action Chunking with Transformers</text>

  <!-- Input -->
  <text x="60" y="150" text-anchor="middle" font-size="13" fill="#475569">Observations</text>
  <text x="60" y="168" text-anchor="middle" font-size="12" fill="#94a3b8">(images, sensor data)</text>

  <!-- Stage 1 -->
  <rect x="140" y="100" width="180" height="90" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
  <text x="230" y="135" text-anchor="middle" font-size="15" font-weight="700" fill="#3730a3">Observation Encoder</text>
  <text x="230" y="158" text-anchor="middle" font-size="12" fill="#475569">Conv feature extraction</text>
  <text x="230" y="174" text-anchor="middle" font-size="12" fill="#475569">to compact representation</text>

  <!-- Stage 2 -->
  <rect x="360" y="100" width="180" height="90" rx="10" fill="#ecfeff" stroke="#06b6d4" stroke-width="2"/>
  <text x="450" y="135" text-anchor="middle" font-size="15" font-weight="700" fill="#155e75">Transformer Network</text>
  <text x="450" y="158" text-anchor="middle" font-size="12" fill="#475569">Models temporal</text>
  <text x="450" y="174" text-anchor="middle" font-size="12" fill="#475569">dependencies, predicts chunks</text>

  <!-- Stage 3 -->
  <rect x="580" y="100" width="180" height="90" rx="10" fill="#f0fdf4" stroke="#22c55e" stroke-width="2"/>
  <text x="670" y="135" text-anchor="middle" font-size="15" font-weight="700" fill="#166534">Action Decoder</text>
  <text x="670" y="158" text-anchor="middle" font-size="12" fill="#475569">Chunks to control commands</text>
  <text x="670" y="174" text-anchor="middle" font-size="12" fill="#475569">(joint torques, gripper)</text>

  <!-- Output -->
  <text x="840" y="150" text-anchor="middle" font-size="13" fill="#475569">Actions</text>

  <!-- Arrows -->
  <line x1="92" y1="145" x2="138" y2="145" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="320" y1="145" x2="358" y2="145" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="540" y1="145" x2="578" y2="145" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="760" y1="145" x2="812" y2="145" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
</svg>
